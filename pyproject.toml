[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pactum"
version = "0.3.1"
description = "Lightweight, runnable data contracts for analytics tables."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Rashmit Pawar", email = "work.rashmit@gmail.com" }]
keywords = ["data quality", "data contracts", "analytics engineering", "etl", "pandas"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Database",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "pandas>=2.0",
    "pydantic>=2.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
parquet = ["pyarrow>=14.0"]
dev = ["pytest>=8.0"]

[project.scripts]
pactum = "pactum.cli:main"

[project.urls]
Homepage = "https://github.com/R4SHM1T/pactum"
Issues = "https://github.com/R4SHM1T/pactum/issues"

[tool.hatch.build.targets.wheel]
packages = ["pactum"]

[tool.pytest.ini_options]
testpaths = ["tests"]
